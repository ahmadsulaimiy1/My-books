<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Letterhead — continuation sheet</title>
<link rel="stylesheet" href="assets/letterhead-typography.css">
<link rel="stylesheet" href="assets/letterhead.css">
</head>
<body>
<!-- ═══════════════════════════════════════════════════════════════════════
     THE SECOND SHEET
     Luxury stationery is a SET, not a page. A letter that runs past the
     first sheet must not continue onto blank paper, and must not repeat the
     full masthead either — that would read as a second letter beginning.
     The identity is therefore reduced to its two irreducible marks: the
     insignia at a quarter scale and the name at text size. The register at
     the foot gives way to the folio.
     ═══════════════════════════════════════════════════════════════════════ -->
<div class="sheet">

  <span class="tick tl"></span><span class="tick tr"></span>
  <span class="tick bl"></span><span class="tick br"></span>

  <div class="cont-head">
    <img class="cont-mark" src="assets/insignia-logo.png" alt="Insignia of the Personal Office">
    <div class="cont-name">الإمام أحمد بن إبراهيم السليمي <span style="color:#9C7F4E">(آل سلام)</span></div>
    <div class="rule-group cont-rule">
      <span class="rule-fine"></span><span class="lozenge sm"></span><span class="rule-fine"></span>
    </div>
  </div>

  <div class="folio">&mdash;&nbsp;&nbsp;<span class="n">٢</span>&nbsp;&nbsp;&mdash;</div>

</div>
</body>
</html>
