<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Letterhead — continuation sheet</title>
<link rel="stylesheet" href="assets/letterhead-typography.css">
<link rel="stylesheet" href="assets/materials.css">
<link rel="stylesheet" href="assets/flagship.css">
</head>
<body>
<!-- THE SECOND SHEET
     Luxury stationery is a SET, not a page. A letter that runs past the first
     sheet must not continue onto blank paper, and must not repeat the crown
     either — that would read as a second letter beginning. The identity is cut
     back to what cannot be dropped: the mark, the name at text size, and the
     same three plates, struck as a rule rather than as a band. -->
<div class="sheet">
  <style>.bracket.tl,.bracket.tr{ top:52mm; }</style>

  <div class="cont-head">
    <img class="cont-mark" src="assets/insignia-foil.png" alt="Insignia of the Personal Office">
    <div class="cont-name letterpress">الإمام أحمد بن إبراهيم السليمي (آل سلام)</div>
  </div>
  <div class="cont-plates">
    <div class="f foil-block"></div>
    <div class="c"></div>
    <div class="s"></div>
  </div>

  <span class="bracket tl"><span class="a"></span><span class="b"></span></span>
  <span class="bracket tr"><span class="a"></span><span class="b"></span></span>
  <span class="bracket bl"><span class="a"></span><span class="b"></span></span>
  <span class="bracket br"><span class="a"></span><span class="b"></span></span>

  <span class="watermark"><img src="assets/insignia-deboss.png" alt="" aria-hidden="true"></span>

  <div class="field field--continued"></div>

  <!-- ══ THE PLINTH — the same three plates, inverted ═════════════════════ -->
  <div class="plinth-foil foil-block"></div>
  <div class="plinth-crimson field-crimson"></div>
  <div class="plinth field-sapphire">
    <div class="guil-band">
      <svg class="fill" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect width="100%" height="100%" fill="url(#guil-dense)"/>
      </svg>
    </div>
  </div>
  <div class="contact">
    <span class="foil-type foil-type--dark">+234&nbsp;810&nbsp;430&nbsp;2087<i></i>+44&nbsp;7961&nbsp;869638<i></i>abisulaimiycollege@gmail.com</span>
  </div>
  <div class="folio">I</div>

</div>
</body>
</html>
