name: Release APK Build

# Builds a release APK on every push to any branch. Signing is optional and controlled entirely
# by whether four repository secrets are configured (see BUILD_STATUS.md for exact setup steps):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#
# If all four are present, this workflow decodes the keystore and writes keystore.properties
# before building, so app/build.gradle.kts's existing conditional signing logic (already in the
# repository, unmodified by this workflow) picks it up and produces a signed app-release.apk.
#
# If any are missing, the signing step is skipped entirely and app/build.gradle.kts's existing
# fallback applies: the release build type gets no signingConfig, and Gradle/AGP produce an
# UNSIGNED artifact instead, conventionally named app-release-unsigned.apk. Either way this
# workflow uploads whatever assembleRelease actually produced — it does not fail or block just
# because signing secrets are absent.

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_SECRETS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform 35 + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release signing keystore (optional)
        if: env.HAS_SIGNING_SECRETS == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.keystore"
          cat > "${{ github.workspace }}/keystore.properties" <<EOF
          storeFile=${{ github.workspace }}/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Remove decoded keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.keystore" "${{ github.workspace }}/keystore.properties"

      - name: Report signing status
        if: always()
        run: |
          if [ "$HAS_SIGNING_SECRETS" = "true" ]; then
            echo "### Release APK: signing secrets were present — build attempted a signed APK." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release APK: no signing secrets configured — build produced an UNSIGNED APK (app-release-unsigned.apk). See BUILD_STATUS.md to add real signing secrets." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
