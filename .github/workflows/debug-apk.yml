name: Debug APK Build

# Builds an unsigned debug APK on every push to any branch. Debug builds are auto-signed by AGP
# with its built-in debug keystore, so no secrets are needed for this workflow at all — it should
# always be able to produce an installable (if unsigned-for-distribution) APK as long as the
# source compiles.

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk/targetSdk are pinned to 35 in app/build.gradle.kts — install exactly that
      # platform plus its matching build-tools rather than relying on whatever the runner image
      # happens to already have, so this step behaves the same even if GitHub's default image
      # changes later.
      - name: Install Android SDK platform 35 + build-tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
